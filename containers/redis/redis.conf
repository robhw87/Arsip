# Network & Security
bind 0.0.0.0
protected-mode yes
port 6379

# REQUIRE PASSWORD
# Replace with a strong password or pass via environment/secrets
# requirepass ${REDIS_PASSWORD} 

# Disable or rename dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""
rename-command KEYS ""


# Adjust according to container memory limit (e.g., 80% of container limit)
maxmemory 1gb
maxmemory-policy allkeys-lru

# Rewrite settings
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Keep RDB snapshots as well (optional, but useful for backups)[citation:4]
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Performance Tuning
tcp-backlog 1024
tcp-keepalive 300
timeout 0

# Multithreading for I/O (Redis 6+)[citation:11]
io-threads 4
io-threads-do-reads yes

# Lazy freeing for better latency[citation:4]
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Logging
loglevel notice
