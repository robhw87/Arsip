[package]
name = "cms"
version = "0.1.0"
edition = "2024"

[dependencies]
# -- html compiler
maud = { version = "0.27.0", features = ["axum", "tide"] }
# -- serde
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# -- async 
tokio = { version = "1.53.1", features = ["full", "tracing"] }
# -- web server
axum = { version = "0.8.9", features = ["macros"] }
# --  utilities
uuid = { version = "1.24.1", features = ["serde", "v4", "v7"] }
time = { version = "0.3.55", features = [
  "formatting",
  "local-offset",
  "parsing",
  "serde",
] }
pulldown-cmark = "0.13.4"
ammonia = "4.1.4"

# -- databases
sqlx = { version = "0.9.0", features = [
  "postgres",
  "runtime-tokio",
  "time",
  "tls-native-tls",
  "uuid",
] }
# -- tracing 
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "json",
  "time",
] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
# -- environment 
envy = "0.4.2"
dotenvy = "0.15.7"
# -- error handle
thiserror = "2.0.20"
gray_matter = "0.3.2"
serde_yaml = "0.9.34"
redis = { version = "1.7.0", features = ["tokio-comp"] }
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1"] }
# -- dev-dependencies
[dev-dependencies]
criterion = "0.8.2"
