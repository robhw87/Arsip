[workspace]
resolver = "3"
members = ["adapters", "domain", "services"]

[package]
name = "arsip"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
adapters = { path = "/home/rnz23/projects/arsip/adapters" }
domain = { path = "/home/rnz23/projects/arsip/domain" }
services = { path = "/home/rnz23/projects/arsip/services" }
tokio = { version = "1.54.1", features = ["full", "tracing"] }
# -- serde
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yaml_serde = "0.10.7"
time = { version = "0.3.55", features = [
  "formatting",
  "local-offset",
  "parsing",
  "serde",
  "macros",
] }
# -- databases
sqlx = { version = "0.9.1", features = [
  "postgres",
  "runtime-tokio",
  "time",
  "tls-native-tls",
  "uuid",
] }
# -- tracing 
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "json",
  "time",
] }
tracing = "0.1.44"
# -- environment 
envy = "0.4.2"
dotenvy = "0.15.7"
# -- error handle
thiserror = "2.0.20"
# -- Cache 
redis = { version = "1.7.0", features = ["tokio-comp"] }
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1"] }
# -- dev-dependencies
[dev-dependencies]
criterion = "0.8.2"

[dependencies]
adapters = { workspace = true }
services = { workspace = true }
domain = { workspace = true }
clap = { version = "4.6.8", features = ["derive"] }
